# HOW MUCH?! LIVE · servidor de proves (pre-producció, sense base de dades)
#
#   Aixecar:      docker compose up -d --build      (des de la carpeta docker/)
#   Estat:        docker compose ps
#   Logs:         docker compose logs -f servidor
#   Aturar:       docker compose down
#
# Només nginx surt a fora (port 8090). El servidor de Node no té ports publicats:
# s'hi arriba sempre a través de nginx, pel nom del servei "servidor".

name: howmuch-live

services:
  servidor:
    build: /Servidor
    environment:
      PORT: 3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      servidor:
        condition: service_healthy
    restart: unless-stopped
