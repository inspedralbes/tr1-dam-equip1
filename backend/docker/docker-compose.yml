services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: howmuch
      MARIADB_USER: howmuch
      MARIADB_PASSWORD: howmuchpassword
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  servidor:
    build:
      context: ../..
      dockerfile: backend/docker/Servidor/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: howmuch
      DB_USER: howmuch
      DB_PASSWORD: howmuchpassword
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      servidor:
        condition: service_healthy

volumes:
  db_data:
