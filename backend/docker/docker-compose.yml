services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      # Les credencials es llegeixen de backend/docker/.env (no es puja a git, veure .env.example)
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD al fitxer .env}
      MARIADB_DATABASE: ${DB_NAME:-howmuch}
      MARIADB_USER: ${DB_USER:-howmuch}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD al fitxer .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  servidor:
    build:
      context: ../..
      dockerfile: backend/docker/Servidor/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-howmuch}
      DB_USER: ${DB_USER:-howmuch}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD al fitxer .env}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8090:80"     # port que fa servir el client de Unity (ws://IP:8090)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      servidor:
        condition: service_healthy

volumes:
  db_data:
  ssl_certs:
