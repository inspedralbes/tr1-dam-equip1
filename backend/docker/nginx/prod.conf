# Config de PRODUCCIÓ (tr1grup1.dam.inspedralbes.cat). En local es fa servir default.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80: només per a Let's Encrypt i per redirigir a HTTPS
server {
    listen 80;
    server_name tr1grup1.dam.inspedralbes.cat;

    # certbot deixa aquí el fitxer que Let's Encrypt comprova per renovar el certificat
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: HTTPS i WSS. L'API (/api/...) i el WebSocket van al mateix Node
server {
    listen 443 ssl;
    server_name tr1grup1.dam.inspedralbes.cat;

    ssl_certificate     /etc/letsencrypt/live/tr1grup1.dam.inspedralbes.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tr1grup1.dam.inspedralbes.cat/privkey.pem;

    location / {
        proxy_pass http://servidor:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # sense aquestes dues línies el WS no connecta
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;                         # que no talli sockets que estan una estona sense parlar
    }
}
