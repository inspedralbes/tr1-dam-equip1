# Si la petició és un WebSocket ($http_upgrade = "websocket") enviem "upgrade",
# si és HTTP normal enviem "close". Així la mateixa ruta serveix per a HTTP/HTTPS i WS/WSS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rutes que deixem passar cap al servidor (la resta es redirigeix a /howmuch):
#   /                      WebSocket (i Express redirigeix el navegador a /howmuch)
#   /api/...               API (admin, Unity, Electron)
#   /admin, /game          Express les redirigeix a /howmuch/...
#   /howmuch, /howmuch/assets/..., /howmuch/favicon.ico   la web i els fitxers del build
#   /howmuch/sala, /categories, /pregunta, /resultats, /final, /admin, /game   pantalles de Vue
# Si algú obre una pantalla de la partida sense estar-hi, el router de Vue el torna a l'inici
# (nginx no pot saber si estàs en una partida).

# Port 80: HTTP i WS directe sense necessitat de posar port a la IP
server {
    listen 80;
    server_name _;

    # Les redireccions surten com "Location: /howmuch" (sense host ni port)
    absolute_redirect off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ ^/(api/.*|admin|game|favicon\.ico|howmuch/?|howmuch/assets/.*|howmuch/favicon\.ico|howmuch/(sala|categories|pregunta|resultats|final|admin|game)/?)?$ {
        proxy_pass http://servidor:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    # Qualsevol altra ruta -> a la web (302 i no 301 perquè el navegador no la guardi per sempre)
    location / {
        return 302 /howmuch;
    }
}

# Port 443: HTTPS i WSS (certificat Let's Encrypt o autosignat generat automàticament)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    absolute_redirect off;

    location ~ ^/(api/.*|admin|game|favicon\.ico|howmuch/?|howmuch/assets/.*|howmuch/favicon\.ico|howmuch/(sala|categories|pregunta|resultats|final|admin|game)/?)?$ {
        proxy_pass http://servidor:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    location / {
        return 302 /howmuch;
    }
}
