# Si la petició és un WebSocket ($http_upgrade = "websocket") enviem "upgrade",
# si és HTTP normal enviem "close". Així la mateixa ruta serveix per a les dues coses.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # El servidor de Node fa HTTP (Express) i WebSocket pel mateix port i la mateixa ruta
    location / {
        proxy_pass http://servidor:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # sense aquestes dues línies el WS no connecta
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;                         # que no talli sockets que estan una estona sense parlar
    }
}
